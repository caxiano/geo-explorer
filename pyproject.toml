[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-explorer"
version = "1.0.0"
description = "Explorador fictício de trilhas, desafios e certificados"
requires-python = ">=3.10"

[project.scripts]
geo-explorer = "geo_explorer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
